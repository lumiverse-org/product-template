      conformance_profile: "standard"
    secrets: inherit

  contract-validation:
    name: contract-validation
    uses: lumiverse-org/control-plane/.github/workflows/ci.yml@workflows/v7
    with:
      job: contract-validation
      product_name: "product-template"
      conformance_profile: "standard"
    secrets: inherit

  registry-validation:
    name: registry-validation
    uses: lumiverse-org/control-plane/.github/workflows/ci.yml@workflows/v7
    with:
      job: registry-validation
      product_name: "product-template"
      conformance_profile: "standard"
    secrets: inherit

  parity-check:
    name: parity-check
    uses: lumiverse-org/control-plane/.github/workflows/ci.yml@workflows/v7
    with:
      job: parity-check
