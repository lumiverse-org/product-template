name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-product-template-${{ github.ref }}
  cancel-in-progress: true

# --- Phase 4 contexts ---

jobs:
  unit-tests:
    name: unit-tests
    uses: lumiverse-org/control-plane/.github/workflows/ci.yml@workflows/v7
    with:
      job: unit-tests
      product_name: "product-template"
      conformance_profile: "standard"
    secrets: inherit

  integration-tests:
    name: integration-tests
    uses: lumiverse-org/control-plane/.github/workflows/ci.yml@workflows/v7
    with:
      job: integration-tests
      product_name: "product-template"
      conformance_profile: "standard"
    secrets: inherit

  build:
    name: build
    uses: lumiverse-org/control-plane/.github/workflows/ci.yml@workflows/v7
    with:
      job: build
      product_name: "product-template"
      conformance_profile: "standard"
    secrets: inherit

  security-scan:
    name: security-scan
    uses: lumiverse-org/control-plane/.github/workflows/ci.yml@workflows/v7
    with:
      job: security-scan
      product_name: "product-template"
      conformance_profile: "standard"
    secrets: inherit

  licence-scan:
    name: licence-scan
    uses: lumiverse-org/control-plane/.github/workflows/ci.yml@workflows/v7
    with:
      job: licence-scan
      product_name: "product-template"
